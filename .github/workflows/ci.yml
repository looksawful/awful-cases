name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run repository contract checks
        shell: pwsh
        run: pwsh -File tests/repo-contract.ps1

      - name: Install AutoHotkey v2.0.27
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '2.0.27'
          $expectedSha256 = 'F72CAD4B98A7B5AA050B35D6DEAA0B0E3949929B2AAFF7D0D69858F1F380B3EF'
          $zip = Join-Path $env:RUNNER_TEMP 'autohotkey.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'autohotkey'
          $uri = "https://github.com/AutoHotkey/AutoHotkey/releases/download/v$version/AutoHotkey_$version.zip"

          Invoke-WebRequest -Uri $uri -OutFile $zip
          $actualSha256 = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          if ($actualSha256 -ne $expectedSha256) {
            throw "AutoHotkey archive SHA256 mismatch: $actualSha256"
          }
          Expand-Archive -Path $zip -DestinationPath $dir -Force

          $exe = Get-ChildItem $dir -Recurse -Filter 'AutoHotkey64.exe' | Select-Object -First 1
          if (-not $exe) { throw 'AutoHotkey64.exe was not found after extraction.' }
          "AHK_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run characterization tests
        shell: pwsh
        run: pwsh -File tools/test.ps1 -AutoHotkeyPath "$env:AHK_EXE"

  package:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Windows packages
        shell: pwsh
        run: pwsh -File tools/package.ps1

      - name: Run package contracts
        shell: pwsh
        run: pwsh -File tests/package-contract.ps1

      - name: Upload Windows package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: awful-cases-windows-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
