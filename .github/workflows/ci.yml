name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run repository contract checks
        shell: pwsh
        run: pwsh -File tests/repo-contract.ps1

      - name: Install AutoHotkey 2.0.27
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.27/AutoHotkey_2.0.27.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'autohotkey.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'autohotkey'
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force

          $exe = Get-ChildItem $dir -Recurse -Filter 'AutoHotkey64.exe' | Select-Object -First 1
          if (-not $exe) { throw 'AutoHotkey64.exe was not found after extraction.' }
          "AHK_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run characterization tests
        shell: pwsh
        run: pwsh -File tools/test.ps1 -AutoHotkeyPath "$env:AHK_EXE"
