name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install AutoHotkey v2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ 'User-Agent' = 'awful-cases-ci' }
          $release = Invoke-RestMethod -Headers $headers 'https://api.github.com/repos/AutoHotkey/AutoHotkey/releases/latest'
          $asset = $release.assets | Where-Object { $_.name -match '^AutoHotkey_.*\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw 'AutoHotkey v2 ZIP asset was not found in the latest release.' }

          $zip = Join-Path $env:RUNNER_TEMP 'autohotkey.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'autohotkey'
          Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force

          $exe = Get-ChildItem $dir -Recurse -Filter 'AutoHotkey64.exe' | Select-Object -First 1
          if (-not $exe) { throw 'AutoHotkey64.exe was not found after extraction.' }
          "AHK_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run characterization tests
        shell: pwsh
        run: pwsh -File tools/test.ps1 -AutoHotkeyPath "$env:AHK_EXE"
