name: One-shot PR remediation

on:
  pull_request:
    branches:
      - main
    paths:
      - tools/apply-remediation.py
      - .github/workflows/remediation-pr.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply audited fixes
        shell: pwsh
        run: python tools/apply-remediation.py

      - name: Commit runtime fixes
        shell: pwsh
        run: |
          if (-not (git status --porcelain app/awful-cases.ahk)) { exit 0 }
          git config user.name "awful-cases-ci"
          git config user.email "actions@users.noreply.github.com"
          git add app/awful-cases.ahk
          git commit -m "fix: remediate audited runtime defects"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
